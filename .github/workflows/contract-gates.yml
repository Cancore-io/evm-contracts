name: Contract Gates

# CAN-417 wired into CI. The gas baseline, the bytecode-hash baseline and the
# SMTChecker profile all landed in 8406666, but nothing ran them — a baseline no
# job compares against is a file, not a gate. This is what compares.
#
# Split by cost, not by topic: gas and bytecode are deterministic and finish in
# minutes, so they block a PR. SMTChecker can spend a long time on a single
# hard target, so it runs nightly and reports instead of gating — a proof that
# times out is not a defect, and blocking on it would train people to ignore it.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:41 UTC — off the hour so it doesn't pile onto everyone else's :00 jobs.
    - cron: '41 3 * * *'

concurrency:
  group: contract-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gas-and-bytecode:
    name: Gas regression + bytecode match
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # check-gas-drift.mjs reads reports/gas-report.txt, which only exists once
      # the suite has run with the reporter on. Running the gate without this
      # step compares against a stale file — or silently passes on none.
      - name: Run tests with the gas reporter
        run: REPORT_GAS=true npx hardhat test

      - name: Gas regression gate
        id: gas
        run: npm run gas:check

      - name: Bytecode match gate
        id: bytecode
        run: npm run bytecode:check

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }
          {
            echo "## Contract gates (CAN-417)"
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Gas regression (±3%) | $(icon '${{ steps.gas.outcome }}') ${{ steps.gas.outcome }} |"
            echo "| Bytecode match | $(icon '${{ steps.bytecode.outcome }}') ${{ steps.bytecode.outcome }} |"
            echo ""
            echo "Baselines: \`reports/gas-baseline.json\`, \`abi/bytecode-hashes.json\`."
            echo "Intentional change? Regenerate with \`npm run gas:generate\` / \`npm run bytecode:generate\` and commit the diff."
          } >> "$GITHUB_STEP_SUMMARY"

  smt:
    name: SMTChecker (nightly, report-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Report-only on purpose: an unproven target is an open question, not a
      # regression. Blocking on it would make the whole job noise to be skipped.
      - name: Verify SMT targets
        id: smt
        continue-on-error: true
        run: npm run verify:smt 2>&1 | tee smt-output.txt

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## SMTChecker (CAN-417)"
            echo ""
            echo "Outcome: ${{ steps.smt.outcome }} (report-only)"
            echo ""
            echo '```'
            tail -60 smt-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SMT output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smt-output
          path: smt-output.txt
          retention-days: 7
          if-no-files-found: ignore
