name: Echidna Invariants

# BLOCKING property-based fuzzing of the HTLC invariant harness
# (contracts/test/echidna/EchidnaHTLC.sol). Flipped from report-only after the
# nightly runs stayed consistently green since 2026-07-10 (CAN-418, LeadQA
# re-audit item 3): a falsified invariant now fails the pipeline — on a PR it
# blocks the merge, on main it turns the branch red for triage. Paths-filtered
# so doc/script-only changes skip the fuzz entirely.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    paths:
      - 'contracts/**'
      - 'echidna.yaml'
      - 'hardhat.config.ts'
      - 'package.json'
      - '.github/workflows/echidna.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'echidna.yaml'
      - 'hardhat.config.ts'
      - 'package.json'
      - '.github/workflows/echidna.yml'

jobs:
  echidna:
    name: HTLC property fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run Echidna (property mode)
        id: echidna
        uses: crytic/echidna-action@v2
        with:
          files: .
          contract: EchidnaHTLC
          config: echidna.yaml
          crytic-args: --hardhat-ignore-compile

      - name: Upload Echidna corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echidna-corpus-${{ github.run_number }}
          path: reports/echidna-corpus/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          ICON=$([[ "${{ steps.echidna.outcome }}" == "success" ]] && echo "✅" || echo "⚠️")
          {
            echo "## ${ICON} Echidna Invariants"
            echo ""
            echo "Harness: \`EchidnaHTLC\` — INV-1/INV-2/INV-3/INV-5 on the EVM leg (see docs/rtm/invariants.md)."
            echo "BLOCKING gate (CAN-418): a falsified invariant fails the pipeline."
          } >> "$GITHUB_STEP_SUMMARY"
