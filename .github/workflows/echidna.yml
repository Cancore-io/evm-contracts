name: Echidna Invariants (nightly)

# Non-blocking nightly property-based fuzzing of the HTLC invariant harness
# (contracts/test/echidna/EchidnaHTLC.sol). Echidna is slow and stochastic, so
# it runs on a schedule rather than per-push and never fails the pipeline — a
# broken invariant surfaces as a failed run to triage, not a merge gate.
#
# NOTE: per-push / PR-gating wiring is deferred to the evm-toolchain ticket
# (CAN-418). This workflow provides the runner via crytic/echidna-action.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  # Fuzz on pushes that touch the contracts or the harness — Echidna is slow, so
  # skip pushes that only change docs/scripts. Non-blocking (continue-on-error).
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'echidna.yaml'
      - 'hardhat.config.ts'
      - 'package.json'
      - '.github/workflows/echidna.yml'

jobs:
  echidna:
    name: HTLC property fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run Echidna (property mode)
        id: echidna
        uses: crytic/echidna-action@f7e374e42bf7131f7307a92f5549ed6b2fd17c9d # v2.0.2
        continue-on-error: true
        with:
          files: .
          contract: EchidnaHTLC
          config: echidna.yaml
          crytic-args: --hardhat-ignore-compile

      - name: Upload Echidna corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: echidna-corpus-${{ github.run_number }}
          path: reports/echidna-corpus/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          ICON=$([[ "${{ steps.echidna.outcome }}" == "success" ]] && echo "✅" || echo "⚠️")
          {
            echo "## ${ICON} Echidna Invariants"
            echo ""
            echo "Harness: \`EchidnaHTLC\` — INV-1/INV-2/INV-3/INV-5 on the EVM leg (see docs/rtm/invariants.md)."
            echo "Non-blocking — a failing property is a triage item, not a merge gate."
          } >> "$GITHUB_STEP_SUMMARY"
